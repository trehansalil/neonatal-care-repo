# Redirect HTTP to HTTPS
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;

    # Allow larger uploads (audio/video)
    client_max_body_size 100m;

    # Serve static frontend directly from the mounted html folder
    root /usr/share/nginx/html;
    index index.html;

    # Static assets and HTML (tracker.html, etc.). Fallback to backend if missing.
    location / {
        try_files $uri $uri/ @backend;
    }

    # Proxy API calls to Flask backend (self-signed TLS). If backend switches to HTTP, drop proxy_ssl settings.
    location /api/ {
        proxy_pass https://backend:5000/api/;
        proxy_ssl_verify off;
        proxy_ssl_server_name on;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location @backend {
        proxy_pass https://backend:5000;
        proxy_ssl_verify off;
        proxy_ssl_server_name on;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # MinIO S3 API via /minio/*
    location /minio/ {
        # Strip the /minio prefix so MinIO sees bucket/key paths as expected
        proxy_pass http://minio:9000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # MinIO Console (optional) via /minio-console/*
    location /minio-console/ {
        proxy_pass http://minio:9001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /minio-console;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_redirect http://minio:9001/ /minio-console/;
        proxy_redirect / /minio-console/;
        sub_filter 'href="/' 'href="/minio-console/';
        sub_filter 'src="/' 'src="/minio-console/';
        sub_filter 'action="/' 'action="/minio-console/';
        sub_filter_once off;
    }

    # n8n Automation UI via /automation/*
    location /automation/ {
        proxy_pass http://n8n:5678/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Rewrite paths in HTML to include /automation prefix
        sub_filter 'href="/' 'href="/automation/';
        sub_filter 'src="/' 'src="/automation/';
        sub_filter 'action="/' 'action="/automation/';
        sub_filter '"path":"/' '"path":"/automation/';
        sub_filter "'path':'/" "'path':'/automation/";
        sub_filter_once off;
        sub_filter_types text/html text/css text/javascript application/javascript application/json;
    }

    # Redirect /automation to /automation/
    location = /automation {
        return 301 $scheme://$host/automation/;
    }
}
