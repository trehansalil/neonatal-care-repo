# ┌─────────────────────────────────────────────────────────────────────────┐
# │  COPY THIS FILE to neonatal-care-repo/.github/workflows/build-push.yml │
# │  It does NOT run from hetzner-deployment-service.                       │
# └─────────────────────────────────────────────────────────────────────────┘
#
# Builds the Docker image, pushes to GHCR, then triggers the deploy workflow
# in hetzner-deployment-service via repository_dispatch.

name: Build, Push & Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Trigger deployment after build?'
        required: false
        default: true
        type: boolean

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: trehansalil/neonatal-care

jobs:
  build-push:
    name: Build & Push to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # Required for GHCR push

    outputs:
      image_tag: ${{ steps.sha.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get short SHA
        id: sha
        run: echo "tag=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Trigger Deployment
    runs-on: ubuntu-latest
    needs: build-push
    if: github.ref == 'refs/heads/main' || github.event.inputs.deploy == 'true'

    steps:
      - name: Trigger hetzner-deployment-service
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.DEPLOY_REPO_PAT }}
          script: |
            await github.rest.repos.createDispatchEvent({
              owner: 'trehansalil',
              repo: 'hetzner-deployment-service',
              event_type: 'neonatal-care-image-updated',
              client_payload: {
                app: 'neonatal-care',
                image_tag: '${{ needs.build-push.outputs.image_tag }}'
              }
            });
            console.log('Deployment triggered with tag: ${{ needs.build-push.outputs.image_tag }}');
