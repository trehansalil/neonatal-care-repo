<!-- Range Picker Modal Component -->
<div id="range-modal" class="modal">
    <div class="modal-content h-full md:h-auto md:max-h-[80vh] flex flex-col w-full md:w-[500px]">
        <div class="bg-white p-4 border-b border-slate-100 flex justify-between items-center shrink-0">
            <h3 class="text-lg font-bold text-slate-800">Select Range</h3>
            <button onclick="closeModal('range')" class="p-2 text-slate-400 hover:text-slate-600 rounded-full hover:bg-slate-100">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                </svg>
            </button>
        </div>

        <div class="p-4 border-b border-slate-100 shrink-0">
            <div class="flex bg-slate-100 p-1 rounded-xl">
                <button id="range-tab-presets" class="flex-1 py-2 px-4 rounded-lg text-sm font-bold text-slate-600 hover:text-slate-800 transition-all bg-white shadow-sm text-sky-600" onclick="switchRangeTab('presets')">Presets</button>
                <button id="range-tab-custom" class="flex-1 py-2 px-4 rounded-lg text-sm font-bold text-slate-600 hover:text-slate-800 transition-all" onclick="switchRangeTab('custom')">Custom</button>
            </div>
        </div>

        <div class="flex-1 overflow-y-auto p-4">
            <div id="range-view-presets" class="space-y-2">
                <button onclick="selectPresetAndClose('6h')" class="w-full p-4 text-left rounded-xl hover:bg-slate-50 border border-transparent hover:border-slate-200 flex justify-between items-center group transition-all">
                    <span class="font-semibold text-slate-700">Last 6 hours</span>
                    <span class="text-slate-400 group-hover:text-sky-500">→</span>
                </button>
                <button onclick="selectPresetAndClose('12h')" class="w-full p-4 text-left rounded-xl hover:bg-slate-50 border border-transparent hover:border-slate-200 flex justify-between items-center group transition-all">
                    <span class="font-semibold text-slate-700">Last 12 hours</span>
                    <span class="text-slate-400 group-hover:text-sky-500">→</span>
                </button>
                <button onclick="selectPresetAndClose('today')" class="w-full p-4 text-left rounded-xl hover:bg-slate-50 border border-transparent hover:border-slate-200 flex justify-between items-center group transition-all">
                    <span class="font-semibold text-slate-700">Today</span>
                    <span class="text-slate-400 group-hover:text-sky-500">→</span>
                </button>
                <button onclick="selectPresetAndClose('yesterday')" class="w-full p-4 text-left rounded-xl hover:bg-slate-50 border border-transparent hover:border-slate-200 flex justify-between items-center group transition-all">
                    <span class="font-semibold text-slate-700">Yesterday</span>
                    <span class="text-slate-400 group-hover:text-sky-500">→</span>
                </button>
                <button onclick="selectPresetAndClose('24h')" class="w-full p-4 text-left rounded-xl hover:bg-slate-50 border border-transparent hover:border-slate-200 flex justify-between items-center group transition-all">
                    <span class="font-semibold text-slate-700">Last 24 hours</span>
                    <span class="text-slate-400 group-hover:text-sky-500">→</span>
                </button>
                <button onclick="selectPresetAndClose('week')" class="w-full p-4 text-left rounded-xl hover:bg-slate-50 border border-transparent hover:border-slate-200 flex justify-between items-center group transition-all">
                    <span class="font-semibold text-slate-700">This Week</span>
                    <span class="text-slate-400 group-hover:text-sky-500">→</span>
                </button>
            </div>

            <div id="range-view-custom" class="hidden space-y-6">
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Date Range</label>
                    <div class="bg-slate-50 rounded-xl p-4 border border-slate-200">
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="text-xs text-slate-500 mb-1 block font-semibold">From</label>
                                <input type="date" id="custom-start-date" class="w-full bg-white border border-slate-200 rounded-lg px-3 py-2 text-sm font-semibold outline-none focus:border-sky-500 focus:ring-2 focus:ring-sky-200 transition-all">
                            </div>
                            <div>
                                <label class="text-xs text-slate-500 mb-1 block font-semibold">To</label>
                                <input type="date" id="custom-end-date" class="w-full bg-white border border-slate-200 rounded-lg px-3 py-2 text-sm font-semibold outline-none focus:border-sky-500 focus:ring-2 focus:ring-sky-200 transition</div>
                        -all">
                            </div>
                    </div>
                </div>

                <div>
                    <div class="flex justify-between items-center mb-2">
                        <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider">Time Range</label>
                        <button onclick="setCustomEndTimeNow()" class="text-xs font-bold text-sky-600 bg-sky-50 px-2 py-1 rounded-md hover:bg-sky-100 transition-colors">Set End to Now</button>
                    </div>
                    <div class="bg-slate-50 rounded-xl p-4 border border-slate-200">
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="text-xs text-slate-500 mb-1 block font-semibold">Start Time</label>
                                <input type="time" id="custom-start-time" class="w-full bg-white border border-slate-200 rounded-lg px-3 py-2 text-sm font-semibold outline-none focus:border-sky-500 focus:ring-2 focus:ring-sky-200 transition-all">
                            </div>
                            <div>
                                <label class="text-xs text-slate-500 mb-1 block font-semibold">End Time</label>
                                <input type="time" id="custom-end-time" class="w-full bg-white border border-slate-200 rounded-lg px-3 py-2 text-sm font-semibold outline-none focus:border-sky-500 focus:ring-2 focus:ring-sky-200 transition-all">
                            </div>
                        </div>
                    </div>
                </div>

                <div class="text-xs text-slate-400 text-center italic">
                    Tip: End time will auto-adjust if earlier than start time.
                </div>
            </div>
        </div>

        <div class="p-4 border-t border-slate-100 bg-white shrink-0 flex gap-3">
            <button onclick="closeModal('range')" class="flex-1 py-3 rounded-xl font-bold text-slate-600 hover:bg-slate-50 transition-colors">Cancel</button>
            <button onclick="applyCustomRange()" class="flex-1 py-3 rounded-xl font-bold text-white bg-sky-500 hover:bg-sky-600 shadow-lg shadow-sky-200 transition-all">Apply Range</button>
        </div>
    </div>
</div>
