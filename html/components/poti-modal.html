<!-- Poti (Stool) Modal Component -->
<div id="poti-modal" class="modal">
    <div class="modal-content">
        <div class="bg-amber-50 p-6 border-b border-amber-100">
            <div class="flex justify-between items-center">
                <h3 class="text-xl font-bold text-slate-800 flex items-center gap-2">
                    <span>💩</span> Log Poti (Stool)
                </h3>
                <button onclick="closeModal('poti')" class="text-slate-400 hover:text-slate-600 text-2xl">×</button>
            </div>
        </div>
        <form id="poti-form" class="p-6 space-y-4">
            <div class="datetime-section p-4 rounded-lg">
                <div class="flex items-center justify-between mb-3">
                    <label class="text-sm font-semibold text-slate-700 flex items-center gap-2">
                        <span>📅</span> Date & Time
                    </label>
                    <button type="button" onclick="setCurrentDateTime('poti')" class="text-xs text-amber-600 hover:text-amber-700 font-semibold">
                        Set to Now
                    </button>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <input type="date" id="poti-date" required class="px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-amber-500">
                    <input type="time" id="poti-time" required class="px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-amber-500">
                </div>
                <p class="text-xs text-slate-500 mt-2">ℹ️ You can log past entries by changing the date/time</p>
            </div>
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-2">Number of Soiled Items</label>
                <input type="number" id="poti-count" min="1" max="5" value="1" required class="w-full px-4 py-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-amber-500">
            </div>
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-2">Item Type</label>
                <select id="poti-item-type" class="w-full px-4 py-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-amber-500">
                    <option value="diaper">Diaper</option>
                    <option value="nappy">Nappy</option>
                </select>
            </div>
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-2">Consistency</label>
                <select id="poti-consistency" class="w-full px-4 py-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-amber-500">
                    <option value="liquid">Liquid/Watery</option>
                    <option value="soft">Soft (Normal)</option>
                    <option value="firm">Firm</option>
                    <option value="hard">Hard ⚠️</option>
                </select>
            </div>
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-2">Color</label>
                <select id="poti-color" class="w-full px-4 py-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-amber-500">
                    <option value="yellow">Yellow (Normal)</option>
                    <option value="mustard">Mustard Yellow</option>
                    <option value="green">Green</option>
                    <option value="brown">Brown</option>
                    <option value="black">Black/Tarry ⚠️</option>
                    <option value="red">Red/Bloody ⚠️</option>
                    <option value="white">White/Pale ⚠️</option>
                </select>
            </div>
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-2">Notes (Optional)</label>
                <textarea id="poti-notes" rows="2" class="w-full px-4 py-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-amber-500" placeholder="Any observations..."></textarea>
            </div>
            <button type="submit" class="w-full bg-amber-600 hover:bg-amber-700 text-white font-bold py-3 px-6 rounded-lg transition-colors">
                Save Entry
            </button>
        </form>
    </div>
</div>
