<!-- Weight Modal Component -->
<div id="weight-modal" class="modal">
    <div class="modal-content">
        <div class="bg-purple-50 p-6 border-b border-purple-100">
            <div class="flex justify-between items-center">
                <h3 class="text-xl font-bold text-slate-800 flex items-center gap-2">
                    <span>⚖️</span> Log Weight
                </h3>
                <button onclick="closeModal('weight')" class="text-slate-400 hover:text-slate-600 text-2xl">×</button>
            </div>
        </div>
        <form id="weight-form" class="p-6 space-y-4">
            <div class="datetime-section p-4 rounded-lg">
                <div class="flex items-center justify-between mb-3">
                    <label class="text-sm font-semibold text-slate-700 flex items-center gap-2">
                        <span>📅</span> Date & Time
                    </label>
                    <button type="button" onclick="setCurrentDateTime('weight')" class="text-xs text-purple-600 hover:text-purple-700 font-semibold">
                        Set to Now
                    </button>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <input type="date" id="weight-date" required class="px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-purple-500">
                    <input type="time" id="weight-time" required class="px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-purple-500">
                </div>
                <p class="text-xs text-slate-500 mt-2">ℹ️ You can log past entries by changing the date/time</p>
            </div>
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-2">Weight (grams)</label>
                <input type="number" id="weight-value" step="1" min="1000" max="10000" required class="w-full px-4 py-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-purple-500" placeholder="2500">
                <p class="text-xs text-slate-500 mt-1">Normal range for newborns: 2500-4000g</p>
            </div>
            <div id="weight-info" class="p-4 bg-purple-100 border border-purple-300 rounded-lg">
                <p class="text-sm text-purple-800 font-semibold">💡 Weight Tracking Tips</p>
                <p class="text-xs text-purple-700 mt-1">Weigh baby at the same time each day for consistency. Weight can fluctuate 50-100g daily.</p>
            </div>
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-2">Notes (Optional)</label>
                <textarea id="weight-notes" rows="2" class="w-full px-4 py-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-purple-500" placeholder="Any observations..."></textarea>
            </div>
            <button type="submit" class="w-full bg-purple-600 hover:bg-purple-700 text-white font-bold py-3 px-6 rounded-lg transition-colors">
                Save Entry
            </button>
        </form>
    </div>
</div>
