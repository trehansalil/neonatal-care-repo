<!-- Feed Modal Component -->
<div id="feed-modal" class="modal">
    <div class="modal-content">
        <div class="bg-sky-50 p-6 border-b border-sky-100">
            <div class="flex justify-between items-center">
                <h3 class="text-xl font-bold text-slate-800 flex items-center gap-2">
                    <span>🍼</span> Log Feed
                </h3>
                <button onclick="closeModal('feed')" class="text-slate-400 hover:text-slate-600 text-2xl">×</button>
            </div>
        </div>
        <form id="feed-form" class="p-6 space-y-4">
            <div class="datetime-section p-4 rounded-lg">
                <div class="flex items-center justify-between mb-3">
                    <label class="text-sm font-semibold text-slate-700 flex items-center gap-2">
                        <span>📅</span> Date & Time
                    </label>
                    <button type="button" onclick="setCurrentDateTime('feed')" class="text-xs text-sky-600 hover:text-sky-700 font-semibold">
                        Set to Now
                    </button>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <input type="date" id="feed-date" required class="px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-sky-500">
                    <input type="time" id="feed-time" required class="px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-sky-500">
                </div>
                <p class="text-xs text-slate-500 mt-2">ℹ️ You can log past entries by changing the date/time</p>
            </div>
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-2">Feed Type</label>
                <select id="feed-type" required class="w-full px-4 py-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-sky-500">
                    <option value="">Select type...</option>
                    <option value="breast">Breastfeeding</option>
                    <option value="bottle">Bottle (Formula)</option>
                    <option value="bottle_expressed">Bottle (Expressed Milk)</option>
                </select>
            </div>
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-2">Amount (mL)</label>
                <input type="number" id="feed-amount" min="0" max="200" class="w-full px-4 py-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-sky-500" placeholder="60">
                <p class="text-xs text-slate-500 mt-1">Leave empty for breastfeeding</p>
            </div>
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-2">Notes (Optional)</label>
                <textarea id="feed-notes" rows="2" class="w-full px-4 py-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-sky-500" placeholder="Any observations..."></textarea>
            </div>
            <button type="submit" class="w-full bg-sky-600 hover:bg-sky-700 text-white font-bold py-3 px-6 rounded-lg transition-colors">
                Save Entry
            </button>
        </form>
    </div>
</div>
