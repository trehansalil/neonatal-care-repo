<!-- Susu (Urine) Modal Component -->
<div id="susu-modal" class="modal">
    <div class="modal-content">
        <div class="bg-indigo-50 p-6 border-b border-indigo-100">
            <div class="flex justify-between items-center">
                <h3 class="text-xl font-bold text-slate-800 flex items-center gap-2">
                    <span>💧</span> Log Susu (Urine)
                </h3>
                <button onclick="closeModal('susu')" class="text-slate-400 hover:text-slate-600 text-2xl">×</button>
            </div>
        </div>
        <form id="susu-form" class="p-6 space-y-4">
            <div class="datetime-section p-4 rounded-lg">
                <div class="flex items-center justify-between mb-3">
                    <label class="text-sm font-semibold text-slate-700 flex items-center gap-2">
                        <span>📅</span> Date & Time
                    </label>
                    <button type="button" onclick="setCurrentDateTime('susu')" class="text-xs text-indigo-600 hover:text-indigo-700 font-semibold">
                        Set to Now
                    </button>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <input type="date" id="susu-date" required class="px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500">
                    <input type="time" id="susu-time" required class="px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500">
                </div>
                <p class="text-xs text-slate-500 mt-2">ℹ️ You can log past entries by changing the date/time</p>
            </div>
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-2">Number of Wet Items</label>
                <input type="number" id="susu-count" min="1" max="5" value="1" required class="w-full px-4 py-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500">
            </div>
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-2">Item Type</label>
                <select id="susu-item-type" class="w-full px-4 py-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500">
                    <option value="diaper">Diaper</option>
                    <option value="nappy">Nappy</option>
                </select>
            </div>
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-2">Urine Color</label>
                <select id="susu-color" class="w-full px-4 py-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500">
                    <option value="clear">Clear (Normal)</option>
                    <option value="pale_yellow">Pale Yellow (Normal)</option>
                    <option value="dark_yellow">Dark Yellow</option>
                    <option value="orange">Orange/Brown ⚠️</option>
                    <option value="red">Red/Pink ⚠️</option>
                </select>
            </div>
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-2">Notes (Optional)</label>
                <textarea id="susu-notes" rows="2" class="w-full px-4 py-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500" placeholder="Any observations..."></textarea>
            </div>
            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-6 rounded-lg transition-colors">
                Save Entry
            </button>
        </form>
    </div>
</div>
