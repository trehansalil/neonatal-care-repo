<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Baby Tracker - Modular Test</title>
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
            background-color: #f8fafc;
        }

        /* Timeline styles */
        .timeline-container {
            position: relative;
        }

        .timeline-container::before {
            content: '';
            position: absolute;
            top: 0;
            bottom: 0;
            left: 35px;
            width: 2px;
            background-color: #e2e8f0;
            z-index: 0;
        }

        .timeline-item {
            position: relative;
            z-index: 1;
        }

        /* Swipe Gesture Support */
        .timeline-card-content {
            transition: transform 0.3s cubic-bezier(0.4, 0.0, 0.2, 1);
            touch-action: pan-y;
            user-select: none;
        }

        /* Context Menu */
        .context-menu {
            position: fixed;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
            border: 1px solid #e2e8f0;
            z-index: 1000;
            min-width: 180px;
            overflow: hidden;
            animation: scaleIn 0.1s ease-out;
            transform-origin: top left;
        }

        .context-menu-item {
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 500;
            color: #334155;
            border: none;
            width: 100%;
            text-align: left;
            background: transparent;
        }

        .context-menu-item:hover {
            background: #f1f5f9;
        }

        .context-menu-item.destructive {
            color: #ef4444;
        }

        .context-menu-item.destructive:hover {
            background: #fef2f2;
        }

        .context-menu-overlay {
            position: fixed;
            inset: 0;
            z-index: 999;
            background: transparent;
        }

        @keyframes scaleIn {
            from {
                opacity: 0;
                transform: scale(0.95);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        /* Loading spinner */
        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #6366f1;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="p-4">
    <div class="max-w-4xl mx-auto">
        <!-- Header -->
        <div class="bg-white rounded-2xl shadow-sm p-6 mb-6">
            <h1 class="text-3xl font-bold text-slate-900">👶 Baby Tracker</h1>
            <p class="text-slate-500 mt-2">Modular Version - Testing Pagination & Infinite Scroll</p>
        </div>

        <!-- Entries Container -->
        <div class="bg-white rounded-2xl shadow-sm p-6">
            <h2 class="text-xl font-bold text-slate-900 mb-4">Recent Entries</h2>

            <!-- Loading Indicator -->
            <div id="loading-indicator" class="flex justify-center py-8">
                <div class="spinner"></div>
            </div>

            <!-- Entries List (Scrollable) -->
            <div class="overflow-y-auto max-h-[600px]" id="scroll-container">
                <div id="entries-container">
                    <!-- Entries will be rendered here by EntryList component -->
                </div>
            </div>

            <!-- Load More Button (Fallback) -->
            <div class="text-center mt-4">
                <button
                    id="load-more-btn"
                    onclick="window.entryList?.loadNextPage()"
                    class="px-6 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 transition-colors disabled:opacity-50 disabled:cursor-not-allowed"
                >
                    Load More
                </button>
                <p class="text-sm text-slate-500 mt-2" id="pagination-info"></p>
            </div>
        </div>

        <!-- Debug Info -->
        <div class="bg-slate-100 rounded-2xl p-4 mt-6">
            <h3 class="font-bold text-slate-700 mb-2">Debug Info</h3>
            <pre id="debug-info" class="text-xs text-slate-600 overflow-auto"></pre>
        </div>
    </div>

    <!-- Load main module (ES6) -->
    <script type="module">
        import { state } from './js/core/state.js';

        // Update loading indicator
        state.subscribe((newState) => {
            const loadingIndicator = document.getElementById('loading-indicator');
            const loadMoreBtn = document.getElementById('load-more-btn');
            const paginationInfo = document.getElementById('pagination-info');
            const debugInfo = document.getElementById('debug-info');

            // Show/hide loading
            if (loadingIndicator) {
                loadingIndicator.style.display = newState.ui.loading ? 'flex' : 'none';
            }

            // Update pagination info
            if (paginationInfo) {
                const p = newState.pagination;
                paginationInfo.textContent = `Page ${p.currentPage} of ${p.totalPages} • ${newState.entries.length} / ${p.total} entries loaded`;
            }

            // Disable load more if no more pages
            if (loadMoreBtn) {
                loadMoreBtn.disabled = !newState.pagination.hasMore || newState.ui.loading;
                loadMoreBtn.textContent = newState.pagination.hasMore ? 'Load More' : 'All Loaded';
            }

            // Show debug info
            if (debugInfo) {
                debugInfo.textContent = JSON.stringify({
                    entriesCount: newState.entries.length,
                    page: newState.pagination.currentPage,
                    totalPages: newState.pagination.totalPages,
                    total: newState.pagination.total,
                    hasMore: newState.pagination.hasMore,
                    loading: newState.ui.loading
                }, null, 2);
            }
        });
    </script>

    <!-- Main application -->
    <script type="module" src="./js/main.js"></script>
</body>
</html>
