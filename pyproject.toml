[project]
name = "neonatal-management"
version = "0.1.0"
description = "Neonatal care management application"
requires-python = ">=3.11"
dependencies = [
    "Flask>=3.0.0",
    "Flask-CORS>=4.0.0",
    "clickhouse-connect>=0.7.0",
    "pytz>=2024.1",
    "Werkzeug>=3.0.1",
    "mlx-whisper>=0.4.3",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    "minio>=7.2.0",
    "boto3>=1.34.0",
    "logging>=0.4.9.6",
    "requests>=2.31.0",
    "pyopenssl>=24.0.0",
    "gunicorn>=21.2.0",
    "mlx-audio>=0.2.10",
    "openai>=1.12.0",
    "instructor>=1.14.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
include = ["app.py", "html/**", "src/**"]
