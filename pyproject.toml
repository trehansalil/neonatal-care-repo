[project]
name = "neonatal-management"
version = "0.1.0"
description = "Neonatal care management application"
requires-python = ">=3.11"
dependencies = [
    "Flask>=3.0.0",
    "Flask-CORS>=4.0.0",
    "clickhouse-connect>=0.7.0",
    "pytz>=2024.1",
    "Werkzeug>=3.0.1",
    "mlx-whisper>=0.4.3",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    "minio>=7.2.0",
    "boto3>=1.34.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
include = ["app.py", "html/**", "src/**"]
