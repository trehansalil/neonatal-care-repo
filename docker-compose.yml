
services:
  # ClickHouse Analytics Database
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: baby-tracker-clickhouse
    user: root
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-baby_tracker}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-clickhouse}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-clickhouse}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "8123:8123"  # HTTP interface
      - "9000:9000"  # Native protocol
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - clickhouse_logs:/var/log/clickhouse-server
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO S3 Compatible Storage
  minio:
    image: minio/minio:latest
    container_name: baby-tracker-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      # Enable CORS for all origins to allow audio playback from the frontend
      MINIO_API_CORS_ALLOW_ORIGIN: "*"
    ports:
      - "9002:9000"  # API (mapped to 9002 to avoid conflict with ClickHouse)
      - "9001:9001"  # Console
    volumes:
      - minio_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # Flask Backend API
  backend:
    build: .
    container_name: baby-tracker-backend
    command: >
      uv run gunicorn 
      --workers 4 
      --bind 0.0.0.0:5000 
      --certfile=cert.pem 
      --keyfile=key.pem 
      --timeout 120 
      app:app
    environment:
      DB_HOST: ${DB_HOST:-clickhouse}
      DB_NAME: ${DB_NAME:-baby_tracker}
      DB_USER: ${DB_USER:-clickhouse}
      DB_PASSWORD: ${DB_PASSWORD:-clickhouse}
      DB_PORT: ${DB_PORT:-8123}
      TZ: ${TZ:-Asia/Kolkata}  # Set your timezone here
      ENABLE_HTTPS: "true"
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      AZURE_OPENAI_KEY: ${AZURE_OPENAI_KEY}
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT}
      AZURE_OPENAI_DEPLOYMENT: ${AZURE_OPENAI_DEPLOYMENT}
      AZURE_OPENAI_API_VERSION: ${AZURE_OPENAI_API_VERSION}
      # Notification settings
      N8N_WEBHOOK_ID: ${N8N_WEBHOOK_ID}
      N8N_HOST: ${N8N_HOST:-n8n:5678}
      DIAPER_ALERT_HOURS: ${DIAPER_ALERT_HOURS:-4}
      NOTIFICATION_CHECK_INTERVAL_MINUTES: ${NOTIFICATION_CHECK_INTERVAL_MINUTES:-60}
    ports:
      - "8082:5000"
    depends_on:
      clickhouse:
        condition: service_healthy
      minio:
        condition: service_healthy
      n8n:
        condition: service_started
    restart: unless-stopped
    volumes:
      - ./html:/app/html
      - ./app.py:/app/app.py
      - ./src:/app/src
      - ./cert.pem:/app/cert.pem
      - ./key.pem:/app/key.pem

  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      # Base URL n8n should think it's running on (important for webhooks)
      WEBHOOK_URL: ${WEBHOOK_URL}
      N8N_HOST: 0.0.0.0
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      # Optional: secure cookie off if you're just testing locally
      N8N_SECURE_COOKIE: "false"
    volumes:
      - n8n_data:/home/node/.n8n
      # Optional shared files directory
      - ./local-files:/files

  nginx:
    image: nginx:1.25
    container_name: baby-tracker-nginx
    depends_on:
      backend:
        condition: service_started
      minio:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./html:/usr/share/nginx/html:ro
      - ./cert.pem:/etc/nginx/certs/cert.pem:ro
      - ./key.pem:/etc/nginx/certs/key.pem:ro
    restart: unless-stopped

volumes:
  clickhouse_data:
  clickhouse_logs:
  minio_data:
  n8n_data:

networks:
  default:
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: 1000
