version: '3.8'

services:
  # ClickHouse Analytics Database
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: baby-tracker-clickhouse
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-baby_tracker}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-clickhouse}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-clickhouse}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "8123:8123"  # HTTP interface
      - "9000:9000"  # Native protocol
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - clickhouse_logs:/var/log/clickhouse-server
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO S3 Compatible Storage
  minio:
    image: minio/minio:latest
    container_name: baby-tracker-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9002:9000"  # API (mapped to 9002 to avoid conflict with ClickHouse)
      - "9001:9001"  # Console
    volumes:
      - minio_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # Flask Backend API
  backend:
    build: .
    container_name: baby-tracker-backend
    environment:
      DB_HOST: ${DB_HOST:-clickhouse}
      DB_NAME: ${DB_NAME:-baby_tracker}
      DB_USER: ${DB_USER:-clickhouse}
      DB_PASSWORD: ${DB_PASSWORD:-clickhouse}
      DB_PORT: ${DB_PORT:-8123}
      TZ: ${TZ:-Asia/Kolkata}  # Set your timezone here
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "8082:5000"
    depends_on:
      clickhouse:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - ./html:/app/html
      - ./app.py:/app/app.py

volumes:
  clickhouse_data:
  clickhouse_logs:
  minio_data:
